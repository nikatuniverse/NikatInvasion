<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>NIKAT NEXUS | LECTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=Merriweather&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        /* ESTRUCTURA BASE */
html { scroll-behavior: smooth; }
body { margin: 0; font-family: 'Exo 2', sans-serif; background: linear-gradient(135deg, #050a0f, #0b1c2d); color: #e0f4ff; display: flex; height: 100vh; }
body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.1; }

/* VARIABLES PARA COPYRIGHT DINÁMICO */
:root { --watermark-color: rgba(0, 0, 0, 0.07); }
body.dark { --watermark-color: rgba(255, 255, 255, 0.03); }

/* MENÚS IDÉNTICOS */
nav, aside { width: 400px; background: #091a2a; padding: 30px; height: 100vh; position: fixed; border-left: 1px solid #1f4f75; border-right: 1px solid #1f4f75; box-sizing: border-box; }
nav { left: 0; }
aside { right: 0; }
.logo-link { text-decoration: none; color: inherit; margin-bottom: 30px; display: block; }
.logo-container { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; color: #ffffff; }
.logo-icon { width: 35px; height: 35px; }

/* ESTRUCTURA DEL LECTOR */
#lector-container { margin-left: 250px; margin-right: 250px; padding: 40px; flex: 1; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
#header-fijo { width: 100%; max-width: 700px; margin: 0 auto; padding-bottom: 20px; border-bottom: 2px solid #00b4ff; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

#lector { 
    max-width: 700px; width: 100%; height: 100%; margin: 0 auto; overflow-y: auto; padding: 40px;
    background: #f4ecd8; color: #5c4b37; font-family: 'Merriweather', serif;
    line-height: 1.8; border: 1px solid #2f6e9e; box-sizing: border-box;
    user-select: none; transition: .3s; position: relative;
    transition: opacity 0.3s ease-in-out; /* Esta línea es la clave */
    opacity: 1; /* Estado inicial */
}

/* MARCA DE AGUA (Copyright) */
#lector::before {
    content: "© NIKAT SAGA"; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-45deg);
    font-size: 5rem; color: var(--watermark-color); pointer-events: none;
    z-index: 0; white-space: nowrap; font-family: 'Exo 2', sans-serif; letter-spacing: 10px;
}

/* SCROLL PERSONALIZADO */
#lector::-webkit-scrollbar { width: 8px; }
#lector::-webkit-scrollbar-thumb { background: #00b4ff; border-radius: 4px; }

/* MODOS Y BOTONES */
body.dark #lector { background: #0a0a0c; color: #d1d1d1; }
body.claro #lector { background: #ffffff; color: #1e293b; }

.btn { 
    display: block; width: 100%; padding: 8px 15px; background: rgba(0, 180, 255, 0.1); 
    color: #00b4ff; text-align: center; border: 1px solid #00b4ff; cursor: pointer; 
    border-radius: 2px; margin-bottom: 8px; font-family: 'Courier Prime', monospace;
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
}
.btn:hover { background: #00b4ff; color: #050a0f; box-shadow: 0 0 10px #00b4ff; }
.btn-modo { cursor: pointer; border: 1px solid #1f4f75; background: rgba(9, 26, 42, 0.5); padding: 5px 8px; border-radius: 2px; font-size: 0.9rem; transition: 0.3s; }
.btn-modo:hover { border-color: #00b4ff; background: #091a2a; }

.nav-link {
    display: block; color: #a8dfff; text-decoration: none; margin-top: 20px;
    padding: 10px 0; font-weight: 600; font-size: 0.85rem; text-transform: uppercase;
    transition: 0.3s; border-top: 1px solid #1f4f75; text-align: center;
}
.nav-link:hover { color: #ffffff; padding-left: 5px; border-color: #00b4ff; }

.buy-button { display: block; text-align: center; padding: 12px; background: #00b4ff; color: #050a0f; text-decoration: none; font-weight: bold; border-radius: 4px; margin-top: 20px; }

.biblioteca-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Crea dos columnas */
    gap: 10px;
    margin-bottom: 15px;
}
.portada-mini {
    text-align: center;
}
.portada-mini img {
    width: 100%;
    border-radius: 4px;
    border: 1px solid #1f4f75;
}
.mini-button {
    display: block;
    margin-top: 5px;
    font-size: 0.5rem;
    padding: 4px;
    text-align: center;
    background: rgba(0, 180, 255, 0.2);
    color: white;
    text-decoration: none;
    border-radius: 3px;
}
    </style>
</head>
<body class="papel">

    <hr style="border: 0; border-top: 1px solid #1f4f75; margin: 20px 0;">
    
    <!-- Botón de Apoyo -->
    <a href="https://ko-fi.com/nikatuniverse"

       target="_blank"
       onmouseover="this.style.background='#28a745'; this.style.color='#050a0f'; this.style.fontWeight='bold';"

    </a>
  </div>
  
  <div style="margin-top: 20px; text-align: center;">
      <p style="font-size: 0.6rem; color: #5c7a99; font-family: 'Exo 2'; letter-spacing: 2px;">SISTEMA EDE ARCHIVE // VERSIÓN 2026</p>
  </div>
</aside>

    <script>
        function cargar(archivo, nombreCapitulo) {
    const lector = document.getElementById('lector');
    
    // 1. Fade Out: Hacemos el texto invisible rápidamente
    lector.style.opacity = 0;
    
    // 2. Esperamos a que la transición termine (300ms) antes de cambiar el texto
    setTimeout(() => {
        fetch(archivo)
            .then(res => res.text())
            .then(data => {
                // Actualizar contenido
                lector.innerHTML = `<p>${data.replace(/\n/g, '</p><p>')}</p>`;
                
                // Resetear scroll
                lector.scrollTop = 0;
                
                // Actualizar título
                document.getElementById('titulo-cap').innerText = nombreCapitulo;
                
                // 3. Fade In: Volvemos a mostrar el lector
                lector.style.opacity = 1;
            });
    }, 300); // Este tiempo debe coincidir con el tiempo del CSS (0.3s)
}
        function cambiarModo(modo) { document.body.className = modo; }
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
