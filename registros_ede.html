<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAT NEXUS | ARCHIVOS EDE</title>

    <style>
:root {
    --azul: #00b4ff;
    --naranja: #ff8800;
    --bg: #030812;
}

/* ESTRUCTURA BASE */
html { scroll-behavior: smooth; }
body { 
    margin: 0; 
    font-family: 'Exo 2', sans-serif; 
    background-color: var(--bg); 
    color: #e0f4ff; 
    display: flex; 
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* --- FONDO ESPACIAL --- */
.space-bg {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    background-image: 
        radial-gradient(rgba(255,255,255,0.8) 1.2px, transparent 0),
        radial-gradient(rgba(0,180,255,0.7) 1.5px, transparent 0),
        radial-gradient(rgba(180,60,255,0.5) 2px, transparent 0);
    background-size: 400px 400px, 300px 300px, 600px 600px;
    background-position: 0 0, 100px 70px, 200px 150px;
    opacity: 0.6;
    animation: driftSpace 160s linear infinite;
}

@keyframes driftSpace {
    from { background-position: 0 0, 100px 70px, 200px 150px; }
    to { background-position: 1200px 1200px, 1300px 1270px, 1400px 1350px; }
}

.space-bg::after {
    content: "";
    position: absolute;
    top: 25%; left: 25%;
    width: 800px; height: 450px;
    background: radial-gradient(ellipse, rgba(0, 140, 255, 0.12) 0%, rgba(130, 20, 190, 0.08) 40%, transparent 70%);
    pointer-events: none;
    animation: nebulaPulse 25s ease-in-out infinite alternate;
}

@keyframes nebulaPulse {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.25); opacity: 1; }
}

/* --- CAPA DE METEORITOS --- */
#random-events-layer {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.space-debris {
    position: absolute;
    pointer-events: none;
    opacity: 0.6;
}

.meteor {
    width: 2px;
    height: 2px;
    background: white;
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8), -15px 0 20px rgba(0, 180, 255, 0.5);
    border-radius: 50%;
}

.probe {
    width: 5px;
    height: 1.5px;
    background: var(--azul);
    box-shadow: 0 0 6px var(--azul);
}

/* EFECTO DE ESCANEO TÁCTICO */
body::before { 
    content: ""; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); 
    background-size: 100% 4px; 
    pointer-events: none; 
    z-index: 100; 
    opacity: 0.1; 
}

/* HEADER SUPERIOR UNIFICADO */
header.top-header {
    width: 100%;
    background: rgba(3, 8, 18, 0.85);
    backdrop-filter: blur(10px);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 180, 255, 0.3);
    box-sizing: border-box;
    position: sticky;
    top: 0;
    z-index: 50;
}

.logo-link { text-decoration: none; color: inherit; }
.logo-container { display: flex; align-items: center; gap: 12px; font-weight: 700; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; letter-spacing: 2px; color: #ffffff; }
.logo-icon { width: 32px; height: 32px; }

.nav-menu-container { display: flex; align-items: center; gap: 20px; }
.nav-btn {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid var(--azul);
    color: var(--azul);
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 2px;
    background: rgba(0, 180, 255, 0.03);
    transition: all 0.3s ease;
    cursor: pointer;
    border-radius: 4px;
}
.nav-btn:hover {
    background-color: rgba(0, 180, 255, 0.15);
    color: #ffffff;
    border-color: #ffffff;
    box-shadow: 0 0 15px var(--azul), inset 0 0 10px rgba(0, 180, 255, 0.5);
    transform: translateY(-2px);
}

/* CONTENEDOR DE DISEÑO PRINCIPAL (2 columnas: GALERÍA RELATOS - ASIDE) */
.page-layout {
    display: flex;
    flex: 1;
    position: relative;
    box-sizing: border-box;
    z-index: 2;
}

/* CONTENEDOR CENTRAL DE RELATOS */
#relatos-container { 
    padding: 40px; 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    box-sizing: border-box; 
    max-width: 1150px;
    margin: 0 auto;
}

#header-fijo { 
    width: 100%; 
    padding-bottom: 15px; 
    border-bottom: 1px solid rgba(0, 180, 255, 0.4); 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 30px; 
}

.section-title {
    margin: 0; 
    font-size: 1.2rem; 
    color: var(--azul);
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 2px;
}

.section-subtitle {
    font-size: 0.8rem;
    color: #8ab4d8;
    font-family: 'Exo 2', sans-serif;
}

/* GRID DE 3 COLUMNAS PARA RELATOS */
.stories-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    width: 100%;
}

/* TARJETA DE CADA RELATO */
.story-card {
    background: rgba(5, 10, 15, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 180, 255, 0.35);
    border-radius: 8px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
}

.story-card:hover {
    border-color: var(--azul);
    box-shadow: 0 0 20px rgba(0, 180, 255, 0.35);
    transform: translateY(-5px);
}

.story-cover-link {
    display: block;
    text-decoration: none;
    overflow: hidden;
    border-radius: 6px;
}

.story-cover-img {
    width: 100%;
    height: auto;
    max-height: 360px;
    object-fit: contain;
    border-radius: 6px;
    border: 1px solid rgba(0, 180, 255, 0.25);
    display: block;
    margin: 0 auto;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.story-card:hover .story-cover-img {
    transform: scale(1.02);
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(0, 180, 255, 0.5);
}

.story-title {
    margin: 16px 0 14px 0;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 1.5px;
    color: #ffffff;
    text-transform: uppercase;
}

.inkitt-btn {
    display: block;
    width: 100%;
    padding: 11px 15px;
    background: rgba(0, 180, 255, 0.12);
    color: var(--azul);
    text-decoration: none;
    border: 1px solid var(--azul);
    border-radius: 4px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.inkitt-btn:hover {
    background: var(--azul);
    color: #030812;
    box-shadow: 0 0 15px rgba(0, 180, 255, 0.7);
}

/* PANEL DERECHO: ASIDE DE SAGA */
aside { 
    width: 280px; 
    background: rgba(5, 10, 15, 0.85); 
    backdrop-filter: blur(10px);
    padding: 30px; 
    height: calc(100vh - 73px); 
    position: sticky; 
    top: 73px;
    border-left: 1px solid rgba(0, 180, 255, 0.4);
    box-sizing: border-box;
    z-index: 10;
    overflow-y: auto;
}

.buy-button { 
    display: block; 
    text-align: center; 
    padding: 12px; 
    background: rgba(0, 180, 255, 0.15); 
    border: 1px solid var(--azul);
    color: var(--azul); 
    text-decoration: none; 
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 1px;
    font-weight: bold; 
    border-radius: 4px; 
    margin-top: 15px; 
    transition: all 0.2s ease;
}
.buy-button:hover {
    background: var(--azul);
    color: #030812;
    box-shadow: 0 0 12px rgba(0, 180, 255, 0.6);
}

/* AJUSTE RESPONSIVE */
@media (max-width: 1100px) {
    .page-layout { flex-direction: column; }
    aside { 
        position: relative; 
        width: 100%; 
        height: auto; 
        top: 0;
        border-left: none;
        border-top: 1px solid rgba(0, 180, 255, 0.4); 
    }
    #relatos-container { max-width: 100%; padding: 25px; }
    .stories-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {
    header.top-header { padding: 15px 20px; flex-direction: column; gap: 15px; }
    #header-fijo { flex-direction: column; align-items: flex-start; gap: 8px; }
    .stories-grid {
        grid-template-columns: 1fr;
    }
}
    </style>

    <script>
        // Script para generar meteoritos y sondas de fondo
        function spawnSpaceDebris() {
            const layer = document.getElementById('random-events-layer');
            if (!layer) return;
            const el = document.createElement('div');
            
            const isMeteor = Math.random() < 0.7;
            el.className = `space-debris ${isMeteor ? 'meteor' : 'probe'}`;

            const randomTop = Math.floor(Math.random() * window.innerHeight);
            el.style.top = randomTop + 'px';

            const goingRight = Math.random() < 0.5;
            const startX = goingRight ? -100 : window.innerWidth + 100;
            const endX = goingRight ? window.innerWidth + 100 : -100;
            const targetY = randomTop + (Math.random() * 200 - 100);

            el.style.left = startX + 'px';

            const duration = Math.random() * 13 + 12;
            el.style.transition = `transform ${duration}s linear, opacity ${duration}s ease`;

            layer.appendChild(el);

            setTimeout(() => {
                el.style.transform = `translate(${endX - startX}px, ${targetY - randomTop}px)`;
            }, 50);

            setTimeout(() => {
                el.remove();
            }, duration * 1000);

            const nextTime = Math.random() * 7000 + 5000;
            setTimeout(spawnSpaceDebris, nextTime);
        }

        setTimeout(spawnSpaceDebris, 2000);
    </script>
