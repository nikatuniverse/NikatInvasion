<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAT NEXUS | LECTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=Merriweather&family=Courier+Prime&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="imagenes/iconoae.png">
    <style>
:root {
    --azul: #00b4ff;
    --naranja: #ff8800;
    --bg: #030812;
}

/* ESTRUCTURA BASE */
html { scroll-behavior: smooth; }
body { 
    margin: 0; 
    font-family: 'Exo 2', sans-serif; 
    background-color: var(--bg); 
    color: #e0f4ff; 
    display: flex; 
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* --- FONDO ESPACIAL --- */
.space-bg {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    background-image: 
        radial-gradient(rgba(255,255,255,0.8) 1.2px, transparent 0),
        radial-gradient(rgba(0,180,255,0.7) 1.5px, transparent 0),
        radial-gradient(rgba(180,60,255,0.5) 2px, transparent 0);
    background-size: 400px 400px, 300px 300px, 600px 600px;
    background-position: 0 0, 100px 70px, 200px 150px;
    opacity: 0.6;
    animation: driftSpace 160s linear infinite;
}

@keyframes driftSpace {
    from { background-position: 0 0, 100px 70px, 200px 150px; }
    to { background-position: 1200px 1200px, 1300px 1270px, 1400px 1350px; }
}

.space-bg::after {
    content: "";
    position: absolute;
    top: 25%; left: 25%;
    width: 800px; height: 450px;
    background: radial-gradient(ellipse, rgba(0, 140, 255, 0.12) 0%, rgba(130, 20, 190, 0.08) 40%, transparent 70%);
    pointer-events: none;
    animation: nebulaPulse 25s ease-in-out infinite alternate;
}

@keyframes nebulaPulse {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.25); opacity: 1; }
}

/* --- CAPA DE METEORITOS --- */
#random-events-layer {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.space-debris {
    position: absolute;
    pointer-events: none;
    opacity: 0.6;
}

.meteor {
    width: 2px;
    height: 2px;
    background: white;
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8), -15px 0 20px rgba(0, 180, 255, 0.5);
    border-radius: 50%;
}

.probe {
    width: 5px;
    height: 1.5px;
    background: var(--azul);
    box-shadow: 0 0 6px var(--azul);
}

/* EFECTO DE ESCANEO TÁCTICO */
body::before { 
    content: ""; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); 
    background-size: 100% 4px; 
    pointer-events: none; 
    z-index: 100; 
    opacity: 0.1; 
}

/* HEADER SUPERIOR UNIFICADO */
header.top-header {
    width: 100%;
    background: rgba(3, 8, 18, 0.85);
    backdrop-filter: blur(10px);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 180, 255, 0.3);
    box-sizing: border-box;
    position: sticky;
    top: 0;
    z-index: 50;
}

.logo-link { text-decoration: none; color: inherit; }
.logo-container { display: flex; align-items: center; gap: 12px; font-weight: 700; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; letter-spacing: 2px; color: #ffffff; }
.logo-icon { width: 32px; height: 32px; }

.nav-menu-container { display: flex; align-items: center; gap: 20px; }
.nav-btn {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid var(--azul);
    color: var(--azul);
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 2px;
    background: rgba(0, 180, 255, 0.03);
    transition: all 0.3s ease;
    cursor: pointer;
    border-radius: 4px;
}
.nav-btn:hover {
    background-color: rgba(0, 180, 255, 0.15);
    color: #ffffff;
    border-color: #ffffff;
    box-shadow: 0 0 15px var(--azul), inset 0 0 10px rgba(0, 180, 255, 0.5);
    transform: translateY(-2px);
}

/* CONTENEDOR DE DISEÑO PRINCIPAL (3 columnas: NAV - LECTOR - ASIDE) */
.page-layout {
    display: flex;
    flex: 1;
    position: relative;
    box-sizing: border-box;
    z-index: 2;
}

/* PANEL IZQUIERDO: ARCHIVOS EDE */
nav {
    width: 300px;
    background: rgba(5, 10, 15, 0.85);
    backdrop-filter: blur(10px);
    padding: 30px;
    height: calc(100vh - 73px);
    position: sticky;
    top: 73px;
    border-right: 1px solid rgba(0, 180, 255, 0.4);
    box-sizing: border-box;
    z-index: 10;
    overflow-y: auto;
}

/* TÍTULO / BOTÓN DESPLEGABLE DE ARCHIVOS EDE */
.nav-toggle {
    margin-top: 0;
    color: var(--azul);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 20px;
    padding: 10px;
    background: rgba(0, 180, 255, 0.1);
    border: 1px solid var(--azul);
    border-radius: 4px;
    box-sizing: border-box;
    user-select: none;
}

/* BOTONES DE RELATOS */
.btn { 
    display: block; 
    width: 100%; 
    padding: 10px 15px; 
    background: rgba(0, 180, 255, 0.1); 
    color: var(--azul); 
    text-align: center; 
    border: 1px solid var(--azul); 
    cursor: pointer; 
    border-radius: 4px; 
    margin-bottom: 12px; 
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem; 
    text-transform: uppercase; 
    letter-spacing: 1px; 
    transition: 0.3s;
    box-sizing: border-box;
}
.btn:hover { 
    background: var(--azul); 
    color: #030812; 
    box-shadow: 0 0 12px rgba(0, 180, 255, 0.6); 
    transform: translateY(-2px);
}

/* ESTRUCTURA DEL LECTOR CENTRAL */
#lector-container { 
    padding: 40px; 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    box-sizing: border-box; 
    max-width: 800px;
    margin: 0 auto;
}

#header-fijo { 
    width: 100%; 
    padding-bottom: 15px; 
    border-bottom: 1px solid rgba(0, 180, 255, 0.4); 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 25px; 
}

#titulo-cap {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 2px;
}

.modos { display: flex; gap: 8px; }
.btn-modo { 
    cursor: pointer; 
    border: 1px solid rgba(0, 180, 255, 0.4); 
    background: rgba(5, 10, 15, 0.85); 
    color: #e0f4ff;
    padding: 6px 10px; 
    border-radius: 4px; 
    font-size: 0.85rem; 
    transition: 0.3s; 
}
.btn-modo:hover { border-color: var(--azul); background: rgba(0, 180, 255, 0.15); box-shadow: 0 0 8px rgba(0, 180, 255, 0.4); }

#lector { 
    width: 100%; 
    min-height: 500px;
    max-height: 70vh; 
    margin: 0 auto; 
    overflow-y: auto; 
    padding: 40px;
    background: #f4ecd8; 
    color: #5c4b37; 
    font-family: 'Merriweather', serif;
    line-height: 1.8; 
    border: 1px solid rgba(0, 180, 255, 0.5); 
    box-sizing: border-box;
    user-select: none; 
    position: relative;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    transition: opacity 0.3s ease-in-out; 
    opacity: 1; 
}

/* MARCA DE AGUA (Copyright) */
#lector::before {
    content: "© NIKAT SAGA"; 
    position: absolute; 
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-45deg);
    font-size: 5rem; 
    color: rgba(0, 0, 0, 0.07); 
    pointer-events: none;
    z-index: 0; 
    white-space: nowrap; 
    font-family: 'Orbitron', sans-serif; 
    letter-spacing: 10px;
}

body.dark #lector { background: rgba(5, 10, 15, 0.9); color: #d1d1d1; border-color: rgba(0, 180, 255, 0.4); backdrop-filter: blur(8px); }
body.dark #lector::before { color: rgba(255, 255, 255, 0.03); }

body.claro #lector { background: #ffffff; color: #1e293b; border-color: #cbd5e1; }
body.claro #lector::before { color: rgba(0, 0, 0, 0.04); }

/* SCROLL PERSONALIZADO */
#lector::-webkit-scrollbar { width: 8px; }
#lector::-webkit-scrollbar-thumb { background: var(--azul); border-radius: 4px; }

/* PANEL DERECHO: ASIDE DE SAGA */
aside { 
    width: 280px; 
    background: rgba(5, 10, 15, 0.85); 
    backdrop-filter: blur(10px);
    padding: 30px; 
    height: calc(100vh - 73px); 
    position: sticky; 
    top: 73px;
    border-left: 1px solid rgba(0, 180, 255, 0.4);
    box-sizing: border-box;
    z-index: 10;
    overflow-y: auto;
}

.buy-button { 
    display: block; 
    text-align: center; 
    padding: 12px; 
    background: rgba(0, 180, 255, 0.15); 
    border: 1px solid var(--azul);
    color: var(--azul); 
    text-decoration: none; 
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 1px;
    font-weight: bold; 
    border-radius: 4px; 
    margin-top: 15px; 
    transition: all 0.2s ease;
}
.buy-button:hover {
    background: var(--azul);
    color: #030812;
    box-shadow: 0 0 12px rgba(0, 180, 255, 0.6);
}

/* AJUSTE RESPONSIVE */
@media (min-width: 769px) {
    .nav-content { display: block !important; }
    .nav-toggle { cursor: default; }
}

@media (max-width: 1100px) {
    .page-layout { flex-direction: column; }
    nav, aside { 
        position: relative; 
        width: 100%; 
        height: auto; 
        top: 0;
        border: none;
        border-bottom: 1px solid rgba(0, 180, 255, 0.4); 
    }
    #lector-container { max-width: 100%; padding: 20px; }
}

@media(max-width: 768px) {
    header.top-header { padding: 15px 20px; flex-direction: column; gap: 15px; }
    .nav-content { display: none; }
    .nav-content.active { display: block; }
    .nav-toggle { cursor: pointer; }
}

/* CONTENEDOR DE CADA PORTADA EN EL NAV */
.nav-portada-container {
    background: rgba(5, 10, 15, 0.85);
    backdrop-filter: blur(8px);
    padding: 12px;
    border: 1px solid rgba(0, 180, 255, 0.4);
    border-radius: 6px;
    margin-bottom: 20px;
    text-align: center;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    cursor: pointer;
}

.nav-portada-container:hover {
    border-color: var(--azul);
    box-shadow: 0 0 15px rgba(0, 180, 255, 0.4);
    transform: translateY(-3px);
}

/* LA IMAGEN SE MANTIENE ÍNTEGRA SIN RECORTARSE */
.nav-portada-img {
    width: 100%;
    height: auto;           /* Altura automática según proporción original */
    max-height: 320px;      /* Evita que imágenes demasiado altas desborden el menú */
    object-fit: contain;    /* Clave: asegura que se vea toda la imagen completa */
    border-radius: 4px;
    border: 1px solid rgba(0, 180, 255, 0.3);
    display: block;
    margin: 0 auto;
    transition: 0.2s;
}

.nav-portada-container:hover .nav-portada-img {
    border-color: #ffffff;
    box-shadow: 0 0 10px var(--azul);
}

/* TÍTULO DEBAJO DE LA PORTADA */
.nav-portada-titulo {
    margin-top: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 1px;
    color: #e0f4ff;
    text-transform: uppercase;
}

/* --- AJUSTES ESPECÍFICOS PARA MÓVILES --- */
@media (max-width: 768px) {
    /* Ocultar las portadas visuales en el menú móvil */
    .nav-portada-img {
        display: none !important;
    }

    /* Ajustar el contenedor para que actúe como un botón plano */
    .nav-portada-container {
        padding: 15px !important;
        margin-bottom: 10px !important;
        background: rgba(0, 180, 255, 0.05) !important;
        border: 1px solid var(--azul) !important;
        cursor: pointer;
    }

    /* Asegurar que el título se vea bien como botón */
    .nav-portada-titulo {
        margin-top: 0 !important;
        font-size: 0.85rem !important;
        font-weight: bold;
    }
}
    </style>
</head>
<body class="dark">

    <div class="space-bg"></div>
    <div id="random-events-layer"></div>

    <!-- HEADER SUPERIOR -->
    <header class="top-header">
        <a href="index.html" class="logo-link">
            <div class="logo-container">
                <img src="imagenes/iconoae.png" alt="Logo" class="logo-icon">
                <span>NIKAT NEXUS</span>
            </div>
        </a>
        <div class="nav-menu-container">
            <a href="index.html" class="nav-btn">VOLVER AL INICIO</a>
        </div>
    </header>

    <div class="page-layout">
        <!-- NAV IZQUIERDO: ARCHIVOS EDE -->
        <nav>
            <h3 class="nav-toggle" id="menu-toggle">ARCHIVOS EDE ▾</h3>
            <div id="lista-relatos" class="nav-content">
                <!-- Botón Relato 1 -->
                <div class="nav-portada-container" onclick="cargar('textos/NIKAT_CAUTIVA.txt', 'NIKAT CAUTIVA')">
                    <img src="imagenes/cautiva.png" alt="Nikat Cautiva" class="nav-portada-img">
                    <div class="nav-portada-titulo">NIKAT CAUTIVA</div>
                </div>
                
                <!-- Botón Relato 2 -->
                <div class="nav-portada-container" onclick="cargar('textos/NIKAT_DESERTOR.txt', 'NIKAT DESERTOR')">
                    <img src="imagenes/desertor.png" alt="Nikat Desertor" class="nav-portada-img">
                    <div class="nav-portada-titulo">NIKAT DESERTOR</div>
                </div>
            </div>
        </nav>

        <!-- MAIN CENTRAL: LECTOR -->
        <main id="lector-container">
            <div id="header-fijo">
                <h2 id="titulo-cap" style="margin:0; font-size: 1.1rem; color: var(--azul);">ARCHIVO LECTOR</h2>
                <div class="modos">
                    <button class="btn-modo" onclick="cambiarModo('claro')" title="Modo Claro">☀️</button>
                    <button class="btn-modo" onclick="cambiarModo('dark')" title="Modo Oscuro">🌙</button>
                    <button class="btn-modo" onclick="cambiarModo('papel')" title="Modo Papel">📖</button>
                </div>
            </div>
            <div id="lector">
                <p>Selecciona un archivo desde el panel izquierdo para iniciar la lectura desclasificada.</p>
            </div>
        </main>

        <!-- ASIDE DERECHO: OBRA OFICIAL -->
        <aside id="libro">
            <div style="border: 1px solid rgba(0, 180, 255, 0.4); padding: 15px; border-radius: 8px; background: rgba(5, 10, 15, 0.85); backdrop-filter: blur(8px);">
                <h2 style="margin-top: 0; color: var(--azul); text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; letter-spacing: 2px;">ARCHIVO DE SAGA</h2>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
                    <!-- Libro 1 -->
                    <div style="text-align: center;">
                        <img src="imagenes/portada1.png" alt="Vol 1" style="width:100%; border-radius:4px; border: 1px solid rgba(0, 180, 255, 0.3);">
                        <a href="https://www.amazon.com/-/es/Jonatan-Arley-Hernández-Chavarro/dp/B0GPNXK7NS" class="buy-button" style="margin-top:8px; padding:6px; font-size:0.6rem;" target="_blank">VOL I</a>
                    </div>
                    <!-- Libro 2 -->
                    <div style="text-align: center;">
                        <img src="imagenes/portada2.png" alt="Vol 2" style="width:100%; border-radius:4px; border: 1px solid rgba(0, 180, 255, 0.3);">
                        <a href="https://www.amazon.com/-/es/J-Hernández/dp/B0H4S4S2S2/ref=tmm_pap_swatch_0" class="buy-button" style="margin-top:8px; padding:6px; font-size:0.6rem;" target="_blank">VOL II</a>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(0, 180, 255, 0.3); margin: 20px 0;">
                
                <!-- Botón de Apoyo -->
                <a href="https://ko-fi.com/nikatuniverse" 
                   style="display:block; text-align:center; padding: 10px; background: rgba(40, 167, 69, 0.15); border: 1px solid #28a745; color: #28a745; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; letter-spacing: 1px; border-radius: 4px; transition: 0.3s;" 
                   target="_blank"
                   onmouseover="this.style.background='#28a745'; this.style.color='#030812'; this.style.fontWeight='bold';" 
                   onmouseout="this.style.background='rgba(40, 167, 69, 0.15)'; this.style.color='#28a745'; this.style.fontWeight='normal';">
                    APÓYAME CON DONACIÓN
                </a>
            </div>
            
            <div style="margin-top: 25px; text-align: center;">
                <p style="font-size: 0.6rem; color: #5c7a99; font-family: 'Orbitron'; letter-spacing: 2px;">SISTEMA EDE // 2026</p>
            </div>
        </aside>
    </div>

    <script>
        function cargar(archivo, nombreCapitulo) {
            const lector = document.getElementById('lector');
            lector.style.opacity = 0;
            setTimeout(() => {
                fetch(archivo)
                    .then(res => res.text())
                    .then(data => {
                        lector.innerHTML = `<p>${data.replace(/\n/g, '</p><p>')}</p>`;
                        lector.scrollTop = 0;
                        document.getElementById('titulo-cap').innerText = nombreCapitulo;
                        lector.style.opacity = 1;
                    });
            }, 300);
        }

        function cambiarModo(modo) { 
            // Limpia las clases de modo y aplica la seleccionada
            document.body.classList.remove('dark', 'claro', 'papel');
            document.body.className = modo; 
        }

        // Script para el menú desplegable móvil de Archivos EDE
        document.getElementById('menu-toggle').addEventListener('click', function() {
            if (window.innerWidth <= 768) {
                const lista = document.getElementById('lista-relatos');
                lista.classList.toggle('active');
                this.textContent = this.textContent.includes('▾') ? 'ARCHIVOS EDE ▴' : 'ARCHIVOS EDE ▾';
            }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());

        // Script para generar meteoritos y sondas de fondo idéntico al index principal
        function spawnSpaceDebris() {
            const layer = document.getElementById('random-events-layer');
            if (!layer) return;
            const el = document.createElement('div');
            
            const isMeteor = Math.random() < 0.7;
            el.className = `space-debris ${isMeteor ? 'meteor' : 'probe'}`;

            const randomTop = Math.floor(Math.random() * window.innerHeight);
            el.style.top = randomTop + 'px';

            const goingRight = Math.random() < 0.5;
            const startX = goingRight ? -100 : window.innerWidth + 100;
            const endX = goingRight ? window.innerWidth + 100 : -100;
            const targetY = randomTop + (Math.random() * 200 - 100);

            el.style.left = startX + 'px';

            const duration = Math.random() * 13 + 12;
            el.style.transition = `transform ${duration}s linear, opacity ${duration}s ease`;

            layer.appendChild(el);

            setTimeout(() => {
                el.style.transform = `translate(${endX - startX}px, ${targetY - randomTop}px)`;
            }, 50);

            setTimeout(() => {
                el.remove();
            }, duration * 1000);

            const nextTime = Math.random() * 7000 + 5000;
            setTimeout(spawnSpaceDebris, nextTime);
        }

        setTimeout(spawnSpaceDebris, 2000);
    </script>
</body>
