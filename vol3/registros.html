<style>
    :root {
        --verde: #00ff88; /* Verde cósmico para facciones aliadas y tecnología unificada */
        --dorado: #ffb703; /* Acento secundario para destacar mandos o alianzas */
        --bg: #020f08;     /* Fondo espacial con un sutil subtono verdoso oscuro */
        --text: #e0fff4;
    }

    /* ESTRUCTURA BASE */
    html { scroll-behavior: smooth; }
    body { 
        margin: 0; 
        font-family: 'Exo 2', sans-serif; 
        background-color: var(--bg); 
        color: var(--text); 
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }

    /* --- FONDO ESPACIAL VERDOSO --- */
    .space-bg {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
        background-image: 
            radial-gradient(rgba(255,255,255,0.8) 1.2px, transparent 0),
            radial-gradient(rgba(0,255,136,0.6) 1.5px, transparent 0),
            radial-gradient(rgba(0,180,255,0.4) 2px, transparent 0);
        background-size: 400px 400px, 300px 300px, 600px 600px;
        background-position: 0 0, 100px 70px, 200px 150px;
        opacity: 0.6;
        animation: driftSpace 160s linear infinite;
    }

    @keyframes driftSpace {
        from { background-position: 0 0, 100px 70px, 200px 150px; }
        to { background-position: 1200px 1200px, 1300px 1270px, 1400px 1350px; }
    }

    .space-bg::after {
        content: "";
        position: absolute;
        top: 25%; left: 25%;
        width: 800px; height: 450px;
        background: radial-gradient(ellipse, rgba(0, 255, 136, 0.1) 0%, rgba(0, 100, 150, 0.08) 40%, transparent 70%);
        pointer-events: none;
        animation: nebulaPulse 25s ease-in-out infinite alternate;
    }

    @keyframes nebulaPulse {
        0% { transform: scale(1); opacity: 0.6; }
        100% { transform: scale(1.25); opacity: 1; }
    }

    /* --- CAPA DE METEORITOS --- */
    #random-events-layer {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
    }

    .space-debris {
        position: absolute;
        pointer-events: none;
        opacity: 0.6;
    }

    .meteor {
        width: 2px;
        height: 2px;
        background: white;
        box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8), -15px 0 20px rgba(0, 255, 136, 0.5);
        border-radius: 50%;
    }

    .probe {
        width: 5px;
        height: 1.5px;
        background: var(--verde);
        box-shadow: 0 0 6px var(--verde);
    }

    /* EFECTO DE ESCANEO TÁCTICO */
    body::before { 
        content: ""; 
        position: fixed; 
        top: 0; left: 0; width: 100%; height: 100%; 
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); 
        background-size: 100% 4px; 
        pointer-events: none; 
        z-index: 100; 
        opacity: 0.1; 
    }

    /* HEADER SUPERIOR UNIFICADO */
    header.top-header {
        width: 100%;
        background: rgba(2, 15, 8, 0.85);
        backdrop-filter: blur(10px);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(0, 255, 136, 0.3);
        box-sizing: border-box;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .logo-link {
        text-decoration: none;
        color: inherit;
    }

    .logo-container {

    }

    .nav-menu-container {

        align-items: center;
        gap: 20px;
    }

    .dropdown-container {
        position: relative;
        display: inline-block;

    /* MENÚ IZQUIERDO LATERAL */
    nav.left-sidebar {

    /* TARJETAS DE REGISTROS */
    .gallery-informes { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

    /* PANEL DERECHO */
    aside {

    .modal-contenido {

    .cerrar { position: sticky; top: -20px; float: right; cursor: pointer; color: var(--verde); font-size: 2rem; z-index: 10; }

    /* MINIJUEGOS */
    #slider { appearance: none; width: 100%; height: 10px; background: #020f08; border: 1px solid var(--verde); outline: none; border-radius: 2px; }

    .num-oculto.revelado { opacity: 1 !important; transform: scale(1.1); text-shadow: 0 0 10px var(--verde); }

    /* RESPONSIVE */

    @media(max-width: 768px) {

<script>
// --- ANIMACIÓN DE METEORITOS Y PROBES ---
function spawnSpaceDebris() {
    const layer = document.getElementById('random-events-layer');
    if (!layer) return;
    const el = document.createElement('div');
    
    const isMeteor = Math.random() < 0.7;
    el.className = `space-debris ${isMeteor ? 'meteor' : 'probe'}`;

    const randomTop = Math.floor(Math.random() * window.innerHeight);
    el.style.top = randomTop + 'px';

    const goingRight = Math.random() < 0.5;
    const startX = goingRight ? -100 : window.innerWidth + 100;
    const endX = goingRight ? window.innerWidth + 100 : -100;
    const targetY = randomTop + (Math.random() * 200 - 100);

    el.style.left = startX + 'px';

    const duration = Math.random() * 13 + 12;
    el.style.transition = `transform ${duration}s linear, opacity ${duration}s ease`;

    layer.appendChild(el);

    setTimeout(() => {
        el.style.transform = `translate(${endX - startX}px, ${targetY - randomTop}px)`;
    }, 50);

    setTimeout(() => {
        el.remove();
    }, duration * 1000);

    const nextTime = Math.random() * 7000 + 5000;
    setTimeout(spawnSpaceDebris, nextTime);
}

setTimeout(spawnSpaceDebris, 2000);

// --- MENÚ DESPLEGABLE ---
const dropdownToggle = document.querySelector('.dropdown-toggle');
const dropdownMenu = document.querySelector('.dropdown-menu');

if (dropdownToggle && dropdownMenu) {
    dropdownToggle.addEventListener('click', function(event) {
        event.stopPropagation();
        dropdownMenu.classList.toggle('show');
    });

    window.addEventListener('click', function(event) {
        if (!event.target.matches('.dropdown-toggle')) {
            if (dropdownMenu.classList.contains('show')) {
                dropdownMenu.classList.remove('show');
            }
        }
    });
}

// --- CONFIGURACIÓN DE REGISTROS Y SEGURIDAD ---
let registroPendiente = null;
let frecuenciaObjetivo = 50;
let numerosEncontrados = [];
let codigoObjetivo = [];
let combinacionSecreta = [];
let faseJuego = 'RECOLECCION'; 

function getColorPorNivel(nivel) {
  if (nivel === 'TOP SECRET') return '#ff4500';
  if (nivel === 'CONFIDENCIAL') return '#ffb703';
  return '#00ff88';
}

function getIconoPorNivel(nivel) {
  const color = getColorPorNivel(nivel);
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="${color}"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>`;
}

function mostrarError(txt) {
    const err = document.getElementById('msg-error');
    err.innerText = txt;
    setTimeout(() => err.innerText = "", 3000);
}

function procesarAcceso() {
    document.getElementById('contenido-juego').style.display = 'none';
    document.getElementById('terminal-carga').style.display = 'block';
    
    let barra = document.getElementById('barra-progreso');
    let texto = document.getElementById('texto-consola');
    let pasos = ["Bypass de Firewall...", "Desencriptando registros...", "Sincronizando señal de la Coalición...", "ACCESO CONCEDIDO"];
    let i = 0;

    let interval = setInterval(() => {
        i++;
        barra.style.width = (i * 25) + "%";
        if (pasos[i-1]) texto.innerText = pasos[i-1];
        if (i >= 4) {
            clearInterval(interval);
            setTimeout(() => {
                abrirModal(registroPendiente);
                cerrarSeguridad();
            }, 600);
        }
    }, 600);
}

function cerrarSeguridad() {
    document.getElementById('pantalla-seguridad').style.display = 'none';
    document.getElementById('terminal-carga').style.display = 'none';
    document.getElementById('contenido-juego').style.display = 'block';
}

function abrirModal(item) {
  const modal = document.getElementById("modal-informe");
  const caja = document.getElementById("modal-caja");
  const color = getColorPorNivel(item.nivel);
  
  document.getElementById("modal-titulo").innerText = item.titulo;
  document.getElementById("modal-texto").innerText = item.descripcion;
  document.getElementById("modal-firma").innerText = "AUTORIZADO POR: " + item.firma;
  document.getElementById("modal-nivel").innerHTML = `${getIconoPorNivel(item.nivel)} <span style="margin-left: 8px; vertical-align: super; color:${color}">NIVEL: ${item.nivel}</span>`;
  caja.style.borderColor = color;
  modal.style.display = "block";
}

function cerrarModal() { document.getElementById("modal-informe").style.display = "none"; }

function intentarAbrir(item) {
  if (item.nivel === 'PÚBLICO') {
    abrirModal(item);
  } else {
    registroPendiente = item;
    document.getElementById("pantalla-seguridad").style.display = "block";
    if (item.nivel === 'CONFIDENCIAL') cargarSlider();
    else if (item.nivel === 'TOP SECRET') iniciarEscaneo();
  }
}

// --- MINIJUEGOS ---
function cargarSlider() {
  frecuenciaObjetivo = Math.floor(Math.random() * 81) + 10;
  document.getElementById("area-minijuego").innerHTML = `
    <p style="font-size: 0.75rem; color: #a8ffd9; letter-spacing: 2px; font-family: 'Orbitron', sans-serif;">SINTONIZAR FRECUENCIA:</p>
    <h2 style="color: var(--verde); margin: 10px 0; font-family: 'Orbitron', sans-serif;">${frecuenciaObjetivo} MHz</h2>
    <input type="range" id="slider" min="0" max="100" value="0">
  `;
}

function iniciarEscaneo() {
  faseJuego = 'RECOLECCION';
  numerosEncontrados = [];
  codigoObjetivo = Array.from({length: 4}, () => Math.floor(Math.random() * 10));
  document.getElementById("area-minijuego").innerHTML = `
    <div id="contenedor-juego">
      <p id="instruccion" style="font-size:0.75rem; color: #a8ffd9; font-family: 'Orbitron', sans-serif;">FASE 1: Localice la secuencia de seguridad.</p>
      <div id="escaneo-area" onmousemove="moverLinterna(event)">
        <div id="linterna"></div>
        ${codigoObjetivo.map((num, i) => `
          <div class="num-oculto" id="n${i}" style="position:absolute; top:${Math.random()*150 + 20}px; left:${Math.random()*80 + 5}\%;" onmouseover="revelarNumero(${i}, ${num})">${num}</div>
        `).join('')}
      </div>
    </div>
  `;
}

function moverLinterna(e) {
  const linterna = document.getElementById("linterna");
  const rect = document.getElementById("escaneo-area").getBoundingClientRect();
  linterna.style.left = (e.clientX - rect.left) + "px";
  linterna.style.top = (e.clientY - rect.top) + "px";
}

function revelarNumero(id, num) {
  const el = document.getElementById('n'+id);
  if (!el.classList.contains('revelado')) {
    el.classList.add('revelado');
    numerosEncontrados.push(num);
    if (numerosEncontrados.length === 4) {
      setTimeout(() => {
        combinacionSecreta = [...numerosEncontrados].sort(() => Math.random() - 0.5);
        faseJuego = 'DESCIFRADO';
        document.getElementById("contenedor-juego").innerHTML = `
          <p style="font-family: 'Orbitron', sans-serif; font-size: 0.8rem;">SECUENCIA DETECTADA: [ ${numerosEncontrados.join(' - ')} ]</p>
          <p style="font-size:0.75rem; color:var(--dorado); font-family: 'Orbitron', sans-serif;">FASE 2: Ingrese combinación de 4 dígitos:</p>
          <input type="text" id="input-combinacion" maxlength="4" style="background:#020f08; color:var(--verde); border:1px solid var(--verde); padding:10px; font-size:1.5rem; text-align:center; width:150px; font-family:'Orbitron', sans-serif; border-radius:4px;">
          <div id="bitacora" style="margin-top:15px; font-size:0.7rem; color:#ff4500; font-family:monospace;"></div>
        `;
      }, 600);
    }
  }
}

function verificarAcceso() {
  if (registroPendiente.nivel === 'CONFIDENCIAL') {
    const val = document.getElementById('slider').value;
    if (Math.abs(val - frecuenciaObjetivo) <= 2) procesarAcceso();
    else mostrarError("ERROR: SEÑAL FUERA DE RANGO");
  } else if (registroPendiente.nivel === 'TOP SECRET') {
    if (faseJuego !== 'DESCIFRADO') { mostrarError("ERROR: RECOLECCIÓN INCOMPLETA"); return; }
    
    const intento = document.getElementById("input-combinacion").value;
    if (intento.length < 4) { mostrarError("ERROR: SECUENCIA INCOMPLETA"); return; }
    
    const secretaStr = combinacionSecreta.join('');
    
    if (intento === secretaStr) {
        procesarAcceso();
    } else {
        let pistas = "";
        for (let i = 0; i < 4; i++) {
            let digitoIntento = parseInt(intento[i]);
            let digitoSecreto = combinacionSecreta[i];
            
            if (digitoIntento < digitoSecreto) pistas += "▲ ";
            else if (digitoIntento > digitoSecreto) pistas += "▼ ";
            else pistas += "✔ ";
        }
        
        document.getElementById("bitacora").innerHTML += `
            <div style="margin-bottom:5px; border-left: 2px solid #ff4500; padding-left: 5px;">
                INTENTO ${intento} > <span style="color:var(--verde)">${pistas}</span>
            </div>`;
        mostrarError("ERROR: CÓDIGO INVÁLIDO - REVISAR DIFERENCIAL");
    }
  }
}

    descripcion: "Registro desclasificado sobre las primeras maniobras defensivas de la coalición y el despliegue de tecnología pesada.",
    nivel: "PÚBLICO",
    firma: "COMANDO EDE-40"
  },
  {

    descripcion: "Frecuencia captada cerca del sector Guayaquil. Muestra mutaciones en especímenes Alpha.",
    nivel: "CONFIDENCIAL",
    firma: "UNIDAD NOCTIS"
  },
  {
    titulo: "PROYECTO NATHAN: FASE FINAL",
    descripcion: "Archivos sobre la recuperación y contención del paciente tras la infección Nikat.",
    nivel: "TOP SECRET",
    firma: "DIRECTORIO CIENTÍFICO"
  }
];

function renderizarRegistros(data) {
  const contenedor = document.getElementById('lista-registros');
  contenedor.innerHTML = '';
  data.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card-informe';
    div.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
            ${getIconoPorNivel(item.nivel)}
            <h3 style="margin: 0;">${item.titulo}</h3>
        </div>
        <p style="font-size:0.8rem; color:#a8ffd9; line-height: 1.4;">${item.descripcion.substring(0, 70)}...</p>
        <small style="color:${getColorPorNivel(item.nivel)}; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 1px;">NIVEL: ${item.nivel}</small>
    `;
    div.onclick = () => intentarAbrir(item);
    contenedor.appendChild(div);
  });
}

// Intentar cargar desde 'registros_vol3.json' o 'registros.json', de lo contrario usar datos locales
fetch('registros_vol3.json')
  .then(r => r.json())
  .then(data => renderizarRegistros(data))
  .catch(() => {
    fetch('registros.json')
      .then(r => r.json())
      .then(data => renderizarRegistros(data))
      .catch(e => {
        console.warn("No se encontró JSON externo, utilizando registros predeterminados.", e);
        renderizarRegistros(registrosDataBack);
      });
  });
</script>
