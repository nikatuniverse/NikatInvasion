<head>

<title>REGISTROS | NIKAT INVASIÓN</title>

<style>
    :root {
      --azul: #00b4ff;
      --naranja: #ff8800;
      --bg: #050a0f;
    }

    /* ESTRUCTURA BASE */
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      font-family: 'Exo 2', sans-serif; 
      background-color: var(--bg); 
      color: #e0f4ff; 
      display: flex; 
      overflow-x: hidden;
    }

    /* EFECTO DE ESCANEO TÁCTICO */
    body::before { 
      content: ""; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); 
      background-size: 100% 4px; 
      pointer-events: none; 
      z-index: 100; 
      opacity: 0.1; 
    }

    /* MENÚ IZQUIERDO ESTILO NEXUS */
    nav { 
      width: 250px; 
      background: rgba(5, 10, 15, 0.85); 
      backdrop-filter: blur(10px);
      padding: 30px; 
      height: 100vh; 
      position: fixed; 
      border-right: 1px solid rgba(0, 180, 255, 0.4);
      box-sizing: border-box;
      z-index: 10;
    }
    
    nav h2 { 
      color: var(--azul); 
      font-size: 0.9rem; 
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 2px;
      margin-top: 20px;
    }
    
    nav a { 
      display: block; 
      color: #a8dfff; 
      text-decoration: none; 
      margin-bottom: 15px; 
      font-weight: 600; 
      font-size: 0.75rem; 
      font-family: 'Exo 2', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase; 
      transition: .3s; 
    }
    
    nav a:hover { 
      color: #ffffff; 
      padding-left: 5px; 
      text-shadow: 0 0 8px rgba(0, 180, 255, 0.6);
    }

    /* CONTENIDO CENTRAL */
    main { 
      margin-left: 280px; 
      margin-right: 280px; 
      padding: 40px; 
      flex: 1; 
    }
    
    h1 { 
      text-align: center; 
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 5px; 
      font-weight: 700; 
      font-size: 1.8rem;
      color: var(--azul);
      margin-bottom: 50px; 
      border-bottom: 1px solid rgba(0, 180, 255, 0.4); 
      padding-bottom: 20px; 
      text-shadow: 0 0 10px rgba(0, 180, 255, 0.3);
    }
    
    /* TARJETAS Y LISTA DE REGISTROS */
    .gallery-informes { 
      display: grid; 
      gap: 20px; 
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
    }
    
    .card-informe { 
      background: rgba(5, 10, 15, 0.85); 
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 180, 255, 0.4); 
      padding: 25px; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: 0.3s; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    
    .card-informe:hover { 
      background: rgba(14, 36, 56, 0.6); 
      border-color: var(--azul); 
      box-shadow: 0 0 20px rgba(0, 180, 255, 0.3);
    }
    
    .card-informe h3 { 
      margin-top: 0; 
      color: var(--azul); 
      font-family: 'Courier Prime', monospace; 
    }

    /* PANEL DERECHO ESTILO NEXUS */
    aside { 
      width: 250px; 
      background: rgba(5, 10, 15, 0.85); 
      backdrop-filter: blur(10px);
      padding: 30px; 
      height: 100vh; 
      position: fixed; 
      right: 0; 
      border-left: 1px solid rgba(0, 180, 255, 0.4);
      box-sizing: border-box;
      z-index: 10;
    }
    
    .buy-button { 
      display: block; 
      text-align: center; 
      padding: 12px; 
      background: rgba(0, 180, 255, 0.15); 
      border: 1px solid var(--azul);
      color: var(--azul); 
      text-decoration: none; 
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      font-weight: bold; 
      border-radius: 4px; 
      margin-top: 20px; 
      transition: all 0.2s ease;
    }

    .buy-button:hover {
      background: var(--azul);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 180, 255, 0.6);
    }

    /* MODAL */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; backdrop-filter: blur(5px); }
    .modal-contenido { 
        background: rgba(5, 10, 15, 0.95); 
        margin: 5% auto; 
        padding: 40px; 
        width: 60%; 
        border: 2px solid var(--azul); 
        border-radius: 8px; 
        color: white; 
        position: relative;
        max-height: 80vh; 
        overflow-y: auto; 
        box-shadow: 0 0 30px rgba(0, 180, 255, 0.4);
    }
    .cerrar { position: sticky; top: -20px; float: right; cursor: pointer; color: var(--azul); font-size: 2rem; z-index: 10; }
    .modal-contenido::-webkit-scrollbar { width: 8px; }
    .modal-contenido::-webkit-scrollbar-track { background: var(--bg); border-left: 1px solid rgba(0, 180, 255, 0.3); }
    .modal-contenido::-webkit-scrollbar-thumb { background: var(--azul); border-radius: 4px; }

    /* MINIJUEGOS */
    #slider { appearance: none; width: 100%; height: 10px; background: rgba(5, 10, 15, 0.85); border: 1px solid var(--azul); border-radius: 4px; }
    #slider::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: var(--azul); cursor: pointer; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 10px var(--azul); }
    #escaneo-area { width: 100%; height: 300px; background: #000; position: relative; cursor: crosshair; overflow: hidden; border: 1px solid rgba(0, 180, 255, 0.4); border-radius: 4px; }
    #linterna { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 180, 255, 0.3) 0%, rgba(0,0,0,0) 70%); pointer-events: none; transform: translate(-50%, -50%); }
    .num-oculto { transition: opacity 0.8s ease, transform 0.8s ease; transform: scale(0.8); }
    .num-oculto.revelado { opacity: 1 !important; transform: scale(1); }

    /* ADAPTACIÓN MÓVIL */
    @media(max-width: 1100px) {
        body { flex-direction: column; }
        nav, aside { width: 100%; height: auto !important; position: relative !important; border: none; padding: 20px; box-sizing: border-box; }
        nav { order: 1; border-bottom: 1px solid rgba(0, 180, 255, 0.4); }
        main { order: 2; margin: 0; padding: 20px; }
        aside { order: 3; border-top: 1px solid rgba(0, 180, 255, 0.4); }
        #menu-toggle { display: none !important; }
        .modal-contenido { width: 90% !important; }
    }
</style>
</head>

<body>

<nav>
  <h2>N.I. ARCHIVE</h2>
  <a href="archivo_vol1.html">INICIO</a>
  <a href="registros.html">REGISTROS</a>
</nav>

<main>
  <h1>REGISTROS DESCLASIFICADOS</h1>
  <div id="lista-registros" class="gallery-informes"></div>
</main>

<div id="modal-informe" class="modal">
  <div id="modal-caja" class="modal-contenido"> <span class="cerrar" onclick="cerrarModal()">&times;</span>
    <div id="modal-nivel" style="font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; font-family: 'Orbitron', sans-serif;"></div>
    <h2 id="modal-titulo" style="font-family: 'Orbitron', sans-serif;"></h2>
    <p id="modal-texto" style="font-family: 'Courier Prime', monospace; white-space: pre-line;"></p>
    <hr style="border: 0; border-top: 1px solid rgba(0, 180, 255, 0.3); margin: 20px 0;">
    <small id="modal-firma" style="color: var(--azul); font-family: 'Courier Prime', monospace;"></small>
  </div>
</div>

<div id="pantalla-seguridad" class="modal" style="z-index: 2000;">
  <div class="modal-contenido" style="text-align: center;">
    <span class="cerrar" onclick="cerrarSeguridad()">&times;</span>

    <div id="terminal-carga" style="display:none; text-align:center; padding: 20px;">
        <div id="texto-consola" style="font-family: 'Courier Prime', monospace; color: #00ff00; font-size: 0.9rem; margin-bottom: 10px;">INICIANDO...</div>
        <div style="width: 100%; height: 5px; background: rgba(5, 10, 15, 0.85); border: 1px solid #00ff00;">
            <div id="barra-progreso" style="width: 0%; height: 100%; background: #00ff00; transition: width 0.4s;"></div>
        </div>
    </div>

    <div id="contenido-juego">
        <h2 id="titulo-seguridad" style="font-family: 'Orbitron', sans-serif; font-size: 1.1rem; letter-spacing: 2px;">AUTENTICACIÓN REQUERIDA</h2>
        <div id="area-minijuego" style="margin: 30px 0;"></div>
        <button id="btn-validar" onclick="verificarAcceso()" class="buy-button" style="width: 100%; cursor: pointer;">VALIDAR ACCESO</button>
    </div>
  </div>
</div>

<aside id="libro">
  <div style="border: 1px solid rgba(0, 180, 255, 0.4); padding: 15px; border-radius: 8px; background: rgba(5, 10, 15, 0.85); backdrop-filter: blur(8px);">
    <h2 style="margin-top: 0; color: var(--azul); text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; letter-spacing: 2px;">OBRA OFICIAL</h2>
    <img src="imagenes/portada.png" alt="Portada" style="width:100%; border-radius:4px; margin-bottom: 10px; border: 1px solid rgba(0, 180, 255, 0.3);">
    <p style="font-size: 0.8rem; text-align: center; color: #a8dfff; line-height: 1.4;">
      La guerra con los Nikat ha comenzado. Adquiere el volumen completo.
    </p>
    <a href="https://www.amazon.com/-/es/Jonatan-Arley-Hernández-Chavarro/dp/B0GPNXK7NS" class="buy-button" target="_blank">COMPRAR EN AMAZON</a>
  </div>
</aside>

<script>
// --- CONFIGURACIÓN Y VARIABLES ---
let registroPendiente = null;
let frecuenciaObjetivo = 50;
let numerosEncontrados = [];
let codigoObjetivo = [];
let combinacionSecreta = [];
let faseJuego = 'RECOLECCION'; 

// --- FUNCIONES DE AYUDA ---
function getColorPorNivel(nivel) {
  if (nivel === 'TOP SECRET') return '#ff0000';
  if (nivel === 'CONFIDENCIAL') return '#ffaa00';
  return '#00b4ff';
}

function getIconoPorNivel(nivel) {
  const color = getColorPorNivel(nivel);
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="${color}" stroke="none"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>`;
}

function reproducirClick() {
  const audio = document.getElementById("audio-click");
  if(audio) { audio.pause(); audio.currentTime = 0; audio.play().catch(e => {}); }
}

// --- LÓGICA DE PROCESAMIENTO (LA BARRA DE CARGA HACKER) ---
function procesarAcceso() {
    document.getElementById('contenido-juego').style.display = 'none';
    document.getElementById('terminal-carga').style.display = 'block';
    document.getElementById('btn-validar').style.display = 'none';
    
    let barra = document.getElementById('barra-progreso');
    let texto = document.getElementById('texto-consola');
    let pasos = ["Bypass de Firewall...", "Desencriptando credenciales...", "Sincronizando...", "ACCESO CONCEDIDO"];
    let i = 0;

    let interval = setInterval(() => {
        i++;
        barra.style.width = (i * 25) + "%";
        if (pasos[i-1]) texto.innerText = pasos[i-1];
        
        if (i >= 4) {
            clearInterval(interval);
            setTimeout(() => {
                abrirModal(registroPendiente);
                document.getElementById("pantalla-seguridad").style.display = "none";
                cerrarSeguridad();
            }, 500);
        }
    }, 600);
}

function cerrarSeguridad() {
    document.getElementById('pantalla-seguridad').style.display = 'none';
    document.getElementById('terminal-carga').style.display = 'none';
    document.getElementById('contenido-juego').style.display = 'block';
    document.getElementById('btn-validar').style.display = 'block';
}

// --- LÓGICA DEL MODAL ---
function abrirModal(item) {
  const modal = document.getElementById("modal-informe");
  const caja = document.getElementById("modal-caja");
  const nivelDiv = document.getElementById("modal-nivel");
  const color = getColorPorNivel(item.nivel);
  
  document.getElementById("modal-titulo").innerText = item.titulo;
  document.getElementById("modal-texto").innerText = item.descripcion;
  document.getElementById("modal-firma").innerText = "Firma: " + item.firma;
  nivelDiv.innerHTML = `${getIconoPorNivel(item.nivel)} <span style="margin-left: 8px; vertical-align: super;">NIVEL: ${item.nivel}</span>`;
  caja.style.borderColor = color;
  modal.style.display = "block";
}

function cerrarModal() { document.getElementById("modal-informe").style.display = "none"; }

// --- LÓGICA DE MINIJUEGOS ---
function intentarAbrir(item) {
  if (item.nivel === 'PÚBLICO') {
    abrirModal(item);
  } else {
    registroPendiente = item;
    document.getElementById("pantalla-seguridad").style.display = "block";
    if (item.nivel === 'CONFIDENCIAL') cargarSlider();
    else if (item.nivel === 'TOP SECRET') iniciarEscaneo();
  }
}

function cargarSlider() {
  frecuenciaObjetivo = Math.floor(Math.random() * 81) + 10;
  document.getElementById("area-minijuego").innerHTML = `
    <div style="margin-bottom: 25px;">
      <p style="font-size: 0.7rem; color: #aaa; margin: 0; letter-spacing: 2px; font-family: 'Orbitron', sans-serif;">FRECUENCIA DE TRANSMISIÓN:</p>
      <h2 style="color: var(--azul); margin: 5px 0; font-family: 'Orbitron', sans-serif;">${frecuenciaObjetivo} MHz</h2>
    </div>
    <input type="range" id="slider" min="0" max="100" value="0" style="width:100%" oninput="reproducirClick()">
    <div style="display: flex; justify-content: space-between; font-size: 0.6rem; color: #555; padding: 5px 2px 0;">
      ${Array(11).fill('<span>|</span>').join('')}
    </div>
  `;
}

function iniciarEscaneo() {
  faseJuego = 'RECOLECCION';
  numerosEncontrados = [];
  codigoObjetivo = Array.from({length: 4}, () => Math.floor(Math.random() * 10));
  document.getElementById("area-minijuego").innerHTML = `
    <div id="contenedor-juego">
      <p id="instruccion" style="font-family: 'Exo 2', sans-serif; font-size: 0.85rem; color: #a8dfff;">FASE 1: Escanee el área para revelar la secuencia base.</p>
      <div id="escaneo-area" onmousemove="moverLinterna(event)">
        <div id="linterna"></div>
        ${codigoObjetivo.map((num, i) => `
          <div class="num-oculto" id="n${i}" style="position:absolute; top:${Math.random()*150}px; left:${Math.random()*80}%; opacity:0; color:var(--azul); font-weight:bold; font-size:2rem; transition:0.3s; font-family: 'Orbitron', sans-serif;" onmouseover="revelarNumero(${i}, ${num})">${num}</div>
        `).join('')}
      </div>
    </div>
  `;
}

function moverLinterna(e) {
  const linterna = document.getElementById("linterna");
  const area = document.getElementById("escaneo-area");
  const rect = area.getBoundingClientRect();
  linterna.style.left = (e.clientX - rect.left) + "px";
  linterna.style.top = (e.clientY - rect.top) + "px";
}

function revelarNumero(id, num) {
  const el = document.getElementById('n'+id);
  if (!el.classList.contains('revelado')) {
    el.classList.add('revelado');
    numerosEncontrados.push(num);
    el.style.textShadow = "0 0 10px var(--azul)";
    if (numerosEncontrados.length === 4) {
      setTimeout(() => {
        combinacionSecreta = [...numerosEncontrados].sort(() => Math.random() - 0.5);
        faseJuego = 'DESCIFRADO';
        document.getElementById("contenedor-juego").innerHTML = `
          <div style="animation: fadeIn 1s;">
            <p style="font-family: 'Exo 2', sans-serif;">SECUENCIA REVELADA: ${numerosEncontrados.join(' ')}</p>
            <p style="font-family: 'Exo 2', sans-serif;">FASE 2: Ingrese combinación (4 dígitos):</p>
            <input type="text" id="input-combinacion" maxlength="4" style="background:rgba(5, 10, 15, 0.85); color:var(--azul); border:1px solid var(--azul); padding:10px; font-size:1.5rem; text-align:center; border-radius:4px; font-family: 'Courier Prime', monospace;">
            <div id="bitacora" style="margin-top:15px; font-size:0.8rem; color:#ffaa00; font-family: 'Courier Prime', monospace;"></div>
          </div>
        `;
      }, 800);
    }
  }
}

function verificarCombinacion(intento, secreta) {
    let fijos = 0; let desplazados = 0;
    let iArr = intento.split(''); let sArr = secreta.map(String);
    for (let i = 0; i < 4; i++) { if (iArr[i] === sArr[i]) { fijos++; iArr[i] = sArr[i] = null; } }
    for (let i = 0; i < 4; i++) { if (iArr[i] && sArr.includes(iArr[i])) { desplazados++; sArr[sArr.indexOf(iArr[i])] = null; } }
    return { fijos, desplazados };
}

function verificarAcceso() {
  if (registroPendiente.nivel === 'CONFIDENCIAL') {
    const val = document.getElementById('slider').value;
    if (Math.abs(val - frecuenciaObjetivo) <= 2) procesarAcceso();
    else alert("Sintonía incorrecta.");
  } else if (registroPendiente.nivel === 'TOP SECRET') {
    if (faseJuego !== 'DESCIFRADO') { alert("Fase de recolección incompleta."); return; }
    const intento = document.getElementById("input-combinacion").value;
    const { fijos, desplazados } = verificarCombinacion(intento, combinacionSecreta);
    if (fijos === 4) procesarAcceso();
    else { document.getElementById("bitacora").innerHTML += `<div>Intento ${intento}: ${fijos} Fijos, ${desplazados} Desplazados</div>`; }
  }
}

fetch('registros.json').then(r => r.json()).then(data => {
  const contenedor = document.getElementById('lista-registros');
  data.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card-informe';
    div.innerHTML = `<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">${getIconoPorNivel(item.nivel)}<h3 style="margin: 0; font-family: 'Courier Prime', monospace;">${item.titulo}</h3></div><p style="color: #ccc; font-size: 0.9rem;">${item.descripcion.substring(0, 80)}...</p><small style="color: var(--azul); font-family: 'Orbitron', sans-serif; font-size: 0.7rem;">NIVEL: ${item.nivel}</small>`;
    div.onclick = () => intentarAbrir(item);
    contenedor.appendChild(div);
  });
});

document.getElementById('menu-toggle').addEventListener('click', function() {
    document.querySelector('nav').classList.toggle('activo');
});
</script>

<audio id="audio-click" src="sonidos/click.mp3" preload="auto"></audio>
</body>
</html>
